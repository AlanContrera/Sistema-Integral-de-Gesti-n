<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
</head>

<body
    style="margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f3f4f6;">

    <!-- Fondo gris que cubre toda la pantalla -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0"
        style="background-color: #f3f4f6; padding: 50px 20px;">
        <tr>
            <td align="center">

                <!-- Tarjeta central -->
                <table width="600" cellpadding="0" cellspacing="0" border="0"
                    style="background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.06); text-align: left; border-collapse: collapse;">

                    <!-- Encabezado con Degradado Premium -->
                    <tr>
                        <td
                            style="background: linear-gradient(135deg, #1e1b4b 0%, #4f46e5 100%); background-color: #1e1b4b; padding: 45px 40px; text-align: center;">
                            <h1
                                style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1.5px; color: #ffffff; text-transform: uppercase;">
                                {{ empresa_nombre }}
                            </h1>
                        </td>
                    </tr>

                    <!-- Texto Dinámico del Correo -->
                    <tr>
                        <td style="padding: 45px 45px 25px 45px;">
                            <p
                                style="margin: 0; font-size: 16px; line-height: 1.8; color: #374151; white-space: pre-wrap;">
                                {{ cuerpo_correo }}</p>
                        </td>
                    </tr>

                    <!-- Caja Elegante de Adjunto -->
                    <tr>
                        <td style="padding: 0 45px 45px 45px;">
                            <table width="100%" cellpadding="0" cellspacing="0" border="0"
                                style="background-color: #f8fafc; border-left: 4px solid #4f46e5; border-radius: 0 8px 8px 0;">
                                <tr>
                                    <td style="padding: 20px;">
                                        <p style="margin: 0; font-size: 15px; color: #1e293b; font-weight: 600;">
                                            <span
                                                style="font-size: 18px; vertical-align: middle; margin-right: 8px;">📄</span>
                                            Cotización Adjunta
                                        </p>
                                        <p
                                            style="margin: 8px 0 0 0; font-size: 14px; color: #64748b; line-height: 1.5;">
                                            Consulte el archivo PDF adjunto para conocer el desglose completo de nuestra
                                            propuesta.
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Pie de página (Footer) -->
                    <tr>
                        <td
                            style="background-color: #f1f5f9; padding: 30px 45px; text-align: center; border-top: 1px solid #e2e8f0;">
                            <p style="margin: 0; font-size: 13px; color: #64748b; line-height: 1.6;">
                                Este es un correo generado automáticamente.
                                </strong>.<br>
                                Por favor, no responda directamente a esta dirección.
                            </p>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>

</html>
